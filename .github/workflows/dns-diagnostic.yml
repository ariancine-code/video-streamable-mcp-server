name: DNS and HTTPS diagnostic
on:
  push:
    branches: [experiment/free-video-probe]
    paths: ['.github/workflows/dns-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public DNS and HTTPS transport
        run: |
          python - <<'PY'
          import socket, ssl, urllib.request, urllib.error, json, time
          targets=[
              ('www.youtube.com','https://www.youtube.com/watch?v=k2OVPycHNfA'),
              ('i.ytimg.com','https://i.ytimg.com/vi/k2OVPycHNfA/hqdefault.jpg'),
              ('www.youtube-nocookie.com','https://www.youtube-nocookie.com/'),
              ('googlevideo.com',None),
          ]
          for host,url in targets:
              t=time.monotonic()
              try:
                  ips=sorted({x[4][0] for x in socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)})
                  print('DNS',host,json.dumps(ips),'ms',round((time.monotonic()-t)*1000))
              except OSError as e:
                  print('DNS_FAILURE',host,str(e))
                  continue
              if not url: continue
              try:
                  with socket.create_connection((host,443),timeout=8) as raw:
                      with ssl.create_default_context().wrap_socket(raw,server_hostname=host) as tls:
                          print('TLS',host,tls.version())
                  with urllib.request.urlopen(url,timeout=10) as r:
                      data=r.read(1048576)
                      print('HTTPS',host,r.status,'type',r.headers.get('Content-Type'))
                      if host=='www.youtube.com':
                          import re
                          match=re.search(rb'ytInitialPlayerResponse\s*=\s*',data)
                          if match:
                              player,_=json.JSONDecoder().raw_decode(data[match.end():].decode('utf-8',errors='replace'))
                              status=player.get('playabilityStatus',{})
                              print('PLAYABILITY',json.dumps({'status':status.get('status'),'reason':status.get('reason')}))
                          else: print('PLAYABILITY not present in bounded response')
              except Exception as e:
                  print('TRANSPORT_RESULT',host,type(e).__name__,str(e)[:200])
          PY
