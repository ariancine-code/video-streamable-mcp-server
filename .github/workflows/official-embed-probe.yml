name: Official embedded player access
on:
  push:
    branches: [experiment/free-video-probe]
    paths: ['.github/workflows/official-embed-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect official public embed response
        run: |
          python - <<'PY'
          import urllib.request, re, json
          url='https://www.youtube.com/embed/k2OVPycHNfA'
          try:
              with urllib.request.urlopen(url,timeout=15) as r:
                  print('HTTP',r.status)
                  page=r.read(5000000).decode('utf-8',errors='replace')
              match=re.search(r'ytInitialPlayerResponse\s*=\s*',page)
              if not match:
                  print('No player response exposed; playback unverified')
              else:
                  d,_=json.JSONDecoder().raw_decode(page[match.end():])
                  status=d.get('playabilityStatus',{})
                  print('EMBED_STATUS',status.get('status'))
                  print('REASON',status.get('reason'))
                  print('CAPTION_TRACK_COUNT',len(d.get('captions',{}).get('playerCaptionsTracklistRenderer',{}).get('captionTracks',[])) if status.get('status')=='OK' else 'not inspected')
                  print('PLAYBACK_NOT_VERIFIED_BY_METADATA')
          except Exception as e:
              print('EMBED_REQUEST_FAILED',str(e)[:240])
          PY
