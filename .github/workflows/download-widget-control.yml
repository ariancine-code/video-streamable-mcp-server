name: Public downloader widget control
on:
  push:
    branches: [experiment/free-video-probe]
    paths: ['.github/workflows/download-widget-control.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  widget:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect documented public embed with CC BY film
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, urllib.error, re, json
          from html.parser import HTMLParser
          # Blender Foundation, Big Buck Bunny (2008), CC BY 3.0.
          source='https://www.youtube.com/watch?v=YE7VzlLtp-4'
          url='https://p.savenow.to/api/button/?'+urllib.parse.urlencode({'url':source,'f':'360'})
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__();self.labels=[];self.active=None
              def handle_starttag(self,tag,attrs):
                  if tag in ('button','title'): self.active=tag
              def handle_endtag(self,tag):
                  if tag==self.active:self.active=None
              def handle_data(self,data):
                  if self.active and data.strip():self.labels.append((self.active,data.strip()[:160]))
          try:
              with urllib.request.urlopen(url,timeout=15) as r:
                  print('HTTP',r.status,'TYPE',r.headers.get('Content-Type'))
                  print('FINAL_HOST',urllib.parse.urlparse(r.geturl()).hostname)
                  data=r.read(300000).decode('utf-8',errors='replace')
              p=Page();p.feed(data)
              print('WIDGET_LABELS',json.dumps(p.labels,ensure_ascii=False))
              print('CHALLENGE_REFERENCE',bool(re.search(r'turnstile|captcha|challenge-platform',data,re.I)))
              print('WIDGET_MARKUP_RECEIVED',bool(data))
          except urllib.error.HTTPError as e:
              print('HTTP',e.code,'ACCESS_NOT_VERIFIED')
          except Exception as e: print('ERROR',type(e).__name__,str(e)[:160])
          print('Public widget availability only; no REST job created, no payment, no media downloaded.')
          PY
