name: Free video access probe
on:
  push:
    branches: [experiment/free-video-probe]
    paths: ['.github/workflows/free-video-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install open source metadata client
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Test public video access
        shell: bash
        run: |
          set -eu
          python - <<'PY'
          import json, urllib.request
          url = "https://www.youtube.com/oembed?url=https%3A%2F%2Fwww.youtube.com%2Fwatch%3Fv%3Dk2OVPycHNfA&format=json"
          try:
              with urllib.request.urlopen(url, timeout=15) as r:
                  data = json.load(r)
              print("OEMBED OK:", json.dumps({k:data.get(k) for k in ("title","author_name","thumbnail_url")}, ensure_ascii=False))
          except Exception as e:
              print("OEMBED FAILED:", str(e))
          PY
          # Metadata only: no download, no account cookies or bypass attempts.
          python -m yt_dlp --no-playlist --skip-download --no-warnings --socket-timeout 15 --retries 0 --extractor-retries 0 --print 'id=%(id)s duration=%(duration)s formats=%(formats.:.format_id)j' --list-subs 'https://www.youtube.com/watch?v=k2OVPycHNfA'
