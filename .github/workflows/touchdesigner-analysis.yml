name: TouchDesigner tutorial analysis probe
on:
  push:
    branches: [experiment/free-video-probe]
    paths: ['.github/workflows/touchdesigner-analysis.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Prepare browser and decoder
        run: |
          python -m pip install --disable-pip-version-check playwright cryptography
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg >/dev/null
      - name: Test public interface and inspect temporary video
        run: |
          python - <<'PY'
          import json,re,pathlib,urllib.parse,subprocess,base64,secrets,hashlib
          from playwright.sync_api import sync_playwright
          from cryptography.hazmat.primitives.asymmetric import rsa,padding
          source='https://www.youtube.com/watch?v=k2OVPycHNfA'
          url='https://p.savenow.to/api/button/?'+urllib.parse.urlencode({'url':source,'f':'720'})
          blocked=re.compile(r'captcha|verify (?:that )?you|not a robot|not a bot|human verification|sign in|log in|payment required|purchase|credit card',re.I)
          n=int('',16)
          key=secrets.token_bytes(32)
          wrapped=rsa.RSAPublicNumbers(65537,n).public_key().encrypt(key,padding.PKCS1v15())
          def analyze(path):
              probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_format','-show_streams','-of','json',str(path)]))
              duration=float(probe['format']['duration'])
              print('VIDEO_PROBE',json.dumps({'duration':duration,'size':path.stat().st_size,'streams':[{k:s.get(k) for k in ('codec_type','codec_name','width','height','channels','sample_rate')} for s in probe['streams']]}),flush=True)
              if not 2400<duration<2520:
                  print('DURATION_MISMATCH: STOP');return
              print('WRAPPED_FRAME_KEY',wrapped.hex(),flush=True)
              for sec in [12,75,210,390,570,750,930,1110,1290,1470,1650,1830,2010,2190,2390]:
                  jpg=subprocess.check_output(['ffmpeg','-v','error','-ss',str(sec),'-i',str(path),'-frames:v','1','-vf','scale=800:-2','-q:v','5','-f','image2pipe','-vcodec','mjpeg','pipe:1'])
                  if not jpg.startswith(b'\xff\xd8'):continue
                  iv=secrets.token_bytes(16)
                  cipher=subprocess.check_output(['openssl','enc','-chacha20','-K',key.hex(),'-iv',iv.hex()],input=jpg)
                  print('ENCRYPTED_FRAME',sec,iv.hex(),hashlib.sha256(jpg).hexdigest(),base64.b64encode(cipher).decode(),flush=True)
              print('FRAME_ANALYSIS_READY',flush=True)
          with sync_playwright() as p:
              browser=p.chromium.launch()
              context=browser.new_context(accept_downloads=True)
              page=context.new_page()
              downloads=[]
              page.on('download',lambda d: downloads.append(d))
              context.on('page',lambda pg: pg.on('download',lambda d: downloads.append(d)))
              try:
                  r=page.goto(url,wait_until='domcontentloaded',timeout=20000)
                  print('HTTP',r.status if r else None)
                  page.wait_for_timeout(3000)
                  def inspect():
                      body=page.locator('body').inner_text(timeout=5000)
                      print('VISIBLE_TEXT',body[:300].replace('\n',' / '),flush=True)
                      return bool(blocked.search(body)) or any('captcha' in f.url.lower() or 'challenges.cloudflare.com' in f.url.lower() for f in page.frames if f!=page.main_frame)
                  if inspect():
                      print('STOP: verification or account/payment requirement')
                  else:
                      control=page.locator('a').filter(has_text='Download MP4 720p').filter(has_text=source)
                      if control.count()!=1 or not control.is_visible() or not control.is_enabled():
                          print('NO_UNAMBIGUOUS_PUBLIC_CONTROL')
                      else:
                          control.click(timeout=5000)
                          final_clicked=False
                          for _ in range(40):
                              page.wait_for_timeout(2500)
                              if inspect():
                                  print('STOP: verification or account/payment requirement');break
                              if not final_clicked and not downloads:
                                  final=page.locator('a,button,[role=button]').filter(has_text=re.compile(r'^\s*Download Now!\s*$',re.I))
                                  if final.count()==1 and final.is_visible() and final.is_enabled():
                                      final.click(timeout=5000);final_clicked=True
                                      print('CLICK_FINAL_PUBLIC_CONTROL',flush=True)
                              if downloads:
                                  d=downloads[0]
                                  print('DOWNLOAD_EVENT',d.suggested_filename,flush=True)
                                  if not d.suggested_filename.lower().endswith('.mp4'):
                                      d.cancel();print('STOP: unexpected type');break
                                  path=pathlib.Path(d.path())
                                  with path.open('rb') as fh: head=fh.read(64)
                                  if head[4:8]==b'ftyp':analyze(path)
                                  else:print('INVALID_MEDIA')
                                  break
                          else:print('DOWNLOAD_NOT_OBSERVED')
              except Exception as e:print('UNVERIFIED',type(e).__name__,str(e)[:200])
              finally:browser.close()
          PY
