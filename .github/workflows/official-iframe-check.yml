name: Official iframe playback check
on:
  push:
    branches: [experiment/free-video-probe]
    paths: ['.github/workflows/official-iframe-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iframe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Set up Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Test documented YouTube iframe API
        run: |
          python - <<'PY'
          import json,threading
          from http.server import BaseHTTPRequestHandler,HTTPServer
          from playwright.sync_api import sync_playwright
          html=b"""<!doctype html><meta charset=utf-8><div id=player></div><script>
          window.events=[];window.player=null;
          function onYouTubeIframeAPIReady(){
          window.player=new YT.Player('player',{width:960,height:540,videoId:'k2OVPycHNfA',
          playerVars:{origin:location.origin},events:{
          onReady:(e)=>{events.push({ready:true});},
          onError:(e)=>events.push({error:e.data}),
          onStateChange:(e)=>events.push({state:e.data})}});
          }
          </script><script src="https://www.youtube.com/iframe_api"></script>"""
          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200);self.send_header('Content-Type','text/html');self.end_headers();self.wfile.write(html)
          server=HTTPServer(('127.0.0.1',0),H)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          with sync_playwright() as p:
              b=p.chromium.launch()
              page=b.new_page(viewport={'width':1100,'height':700})
              try:
                  page.goto('http://127.0.0.1:'+str(server.server_port),wait_until='domcontentloaded',timeout=20000)
                  page.wait_for_timeout(6000)
                  print('INITIAL_EVENTS',page.evaluate('events'))
                  frame=page.frame_locator('iframe')
                  try:
                      body=frame.locator('body').inner_text(timeout=5000)
                      print('PLAYER_TEXT',body[:600])
                      if any(x in body.lower() for x in ('sign in','not a bot','unavailable','captcha')):
                          print('RESTRICTED: STOP')
                      elif page.evaluate('events.some(e=>e.error)'):
                          print('PLAYER_ERROR: STOP')
                      elif page.evaluate('events.some(e=>e.ready)'):
                          play=frame.get_by_role('button',name='Play',exact=True)
                          if play.count(): play.first.click(timeout=5000)
                          else: print('No ordinary Play control found')
                          page.wait_for_timeout(3500)
                          print('FINAL',page.evaluate('({events,time:player.getCurrentTime(),state:player.getPlayerState()})'))
                      else: print('PLAYER NOT READY')
                  except Exception as e: print('PLAYBACK UNVERIFIED',str(e)[:250])
              finally: b.close()
          PY
