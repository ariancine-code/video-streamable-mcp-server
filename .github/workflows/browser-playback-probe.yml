name: Public browser playback probe
on:
  push:
    branches: [experiment/free-video-probe]
    paths: ['.github/workflows/browser-playback-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Check ordinary public player access
        run: |
          python - <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width":1280,"height":720})
              try:
                  r = page.goto("https://www.youtube.com/watch?v=k2OVPycHNfA", wait_until="domcontentloaded", timeout=25000)
                  print("PAGE_STATUS", r.status if r else None)
                  page.wait_for_timeout(5000)
                  print("PAGE_TITLE", page.title())
                  snapshot = page.evaluate("""() => {
                    const player = window.ytInitialPlayerResponse;
                    const v = document.querySelector('video');
                    return {playerStatus:player?.playabilityStatus?.status ?? null,
                            reason:player?.playabilityStatus?.reason ?? null,
                            video:v ? {readyState:v.readyState, currentTime:v.currentTime,
                              width:v.videoWidth, height:v.videoHeight, paused:v.paused} : null};
                  }""")
                  print("INITIAL", json.dumps(snapshot))
                  if snapshot.get("playerStatus") not in (None,"OK"):
                      print("PLAYBACK NOT AUTHORIZED: stopping without attempting alternate access.")
                  elif snapshot.get("video"):
                      page.locator("video").first.evaluate("(v) => {v.muted = true;}")
                      try:
                          page.locator("video").first.evaluate("(v) => Promise.race([v.play(),new Promise((_,r)=>setTimeout(()=>r(new Error('play timeout')),8000))])")
                      except Exception as e:
                          print("PLAY_REQUEST",str(e)[:200])
                      page.wait_for_timeout(4000)
                      result=page.locator("video").first.evaluate("(v)=>({readyState:v.readyState,currentTime:v.currentTime,width:v.videoWidth,height:v.videoHeight,paused:v.paused})")
                      print("AFTER",json.dumps(result))
                      if result["currentTime"] > snapshot["video"]["currentTime"] and result["width"] > 0:
                          print("PLAYBACK VERIFIED")
                      else:
                          print("PLAYBACK NOT VERIFIED")
                  else:
                      print("PLAYER NOT PRESENT; no playback verified")
              finally:
                  browser.close()
          PY
