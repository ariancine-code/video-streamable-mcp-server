name: Download service public availability
on:
  push:
    branches: [experiment/free-video-probe]
    paths: ['.github/workflows/download-service-availability.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public landing pages and documented instance info
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, json, re, html, concurrent.futures
          endpoints=[
              ('Cobalt website','https://cobalt.tools/'),
              ('Cobalt instance info','https://api.cobalt.tools/'),
              ('Loader.to','https://loader.to/'),
              ('Y2Mate','https://www.y2mate.com/'),
              ('SaveFrom','https://savefrom.net/'),
          ]
          def probe(item):
              name,url=item
              result={'service':name}
              try:
                  with urllib.request.urlopen(url,timeout=12) as r:
                      result.update(http=r.status,final_url=r.geturl(),content_type=r.headers.get('Content-Type'))
                      data=r.read(200000)
                      if name=='Cobalt instance info' and 'json' in (result['content_type'] or ''):
                          d=json.loads(data)
                          info=d.get('cobalt',{})
                          result.update(version=info.get('version'),advertised_services=info.get('services'),turnstile_configured=bool(info.get('turnstileSitekey')))
                      elif 'html' in (result['content_type'] or ''):
                          m=re.search(rb'<title[^>]*>(.*?)</title>',data,re.I|re.S)
                          if m: result['title']=html.unescape(m.group(1).decode(errors='replace')).strip()[:160]
              except urllib.error.HTTPError as e: result.update(http=e.code,error=str(e)[:150])
              except Exception as e: result.update(error=type(e).__name__+': '+str(e)[:150])
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              for result in pool.map(probe,endpoints): print('RESULT',json.dumps(result,ensure_ascii=False))
          print('Read-only diagnostics; no media URLs submitted or files downloaded.')
          PY
